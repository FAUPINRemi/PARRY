parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
    
    # Budget Guard - Gère la limite de dépenses locale
    App\Service\AI\BudgetGuard:
        public: true
    
    # Gemini Client - Le mode 'lazy' empêche l'instanciation automatique
    App\Service\AI\GeminiClient:
        lazy: true
        arguments:
            $apiUrl: '%env(GEMINI_API_URL)%'
            $apiKey: '%env(GEMINI_API_KEY)%'
            $model: '%env(GEMINI_MODEL)%'
            $budgetGuard: '@App\Service\AI\BudgetGuard'
            $logger: '@logger'
    
    # Game Redis Service
    App\Service\GameRedisService:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
    
    # Rate Limiter Service
    App\Service\Security\RateLimiter:
        public: true
    
    # Rate Limit Subscriber - Intercepte les bots AVANT l'IA
    App\EventSubscriber\RateLimitSubscriber:
        arguments:
            $rateLimiter: '@App\Service\Security\RateLimiter'
            $logger: '@logger'
        tags:
            - { name: kernel.event_subscriber }