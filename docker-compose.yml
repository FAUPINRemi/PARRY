services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: parry-php
    restart: unless-stopped
    working_dir: /var/www/symfony
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      PHP_CLI_SERVER_WORKERS: 8
    ports:
      - "8000:8000"
    volumes:
      - ./backend-parry-symfony:/var/www/symfony:cached
      - /var/www/symfony/vendor
      - /var/www/symfony/var/cache
      - /var/www/symfony/var/log
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: parry-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: parry-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

  mercure:
    image: dunglas/mercure
    container_name: parry-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET_PUBLISHER}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET_SUBSCRIBER}"
    ports:
      - "${MERCURE_PORT}:80"

  redis:
    image: redis:7-alpine
    container_name: parry-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: parry-redisinsight
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT}:5540"

  frontend:
    build:
      context: .
      target: dev
      dockerfile: ./docker/frontend/Dockerfile
    container_name: parry-frontend
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    ports:
      - "${FRONT_PORT:-80}:80"
    volumes:
      - ./frontend-parry-nuxt:/app
      - /app/node_modules

volumes:
  db-data:
  redis-data:
  redisinsight-data:
  nuxt_node_modules:
