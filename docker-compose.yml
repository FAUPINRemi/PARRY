services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: parry-php
    restart: unless-stopped
    working_dir: /var/www/symfony
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./backend-parry-symfony:/var/www/symfony:cached
      - /var/www/symfony/vendor
      - /var/www/symfony/var/cache
      - /var/www/symfony/var/log
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: parry-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: parry-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

  mercure:
    image: dunglas/mercure
    container_name: parry-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
    ports:
      - "${MERCURE_PORT}:80"

volumes:
  db-data: